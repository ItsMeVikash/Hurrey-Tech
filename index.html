;color:#777}.listrow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #eee}.listrow:last-child{border-bottom:0}.glyph{width:38px;height:38px;flex:none;border-radius:12px;background:#f1f1f1;display:grid;place-items:center;font-size:15px;color:#111;font-weight:700}.grow{flex:1;min-width:0}.rowtitle{font-size:12px;font-weight:700;line-height:1.3}.rowsub{font-size:10px;color:#888;margin-top:3px;line-height:1.35}.chev{color:#aaa;font-size:18px}.search{border:1px solid #e4e4e4;border-radius:13px;height:43px;display:flex;align-items:center;padding:0 12px;gap:8px;color:#777;font-size:12px}.search input{border:0;outline:0;flex:1;min-width:0;font-size:12px}.hero{padding:19px;border-radius:18px;background:#111;color:#fff;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #4a4a4a;border-radius:50%;right:-90px;top:-90px;box-shadow:0 0 0 22px #1b1b1b,0 0 0 44px #252525}.hero>*{position:relative;z-index:1}.hero h2{font-size:24px;line-height:1.05;letter-spacing:-.9px;margin:0 0 8px;max-width:235px}.hero p{font-size:11px;color:#c7c7c7;line-height:1.4;margin:0 0 15px;max-width:220px}.stepper{display:flex;justify-content:space-between;gap:4px;margin:8px 0 22px}.step{flex:1;text-align:center;font-size:9px;color:#999}.step b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid #ccc;margin:0 auto 5px;font-size:10px}.step.active{color:#111;font-weight:700}.step.active b{background:#111;color:white;border-color:#111}.chatbubble{max-width:88%;padding:12px 13px;border-radius:15px;font-size:12px;line-height:1.45;margin:10px 0}.chatbubble.wiseman{background:#f1f1f1;border-bottom-left-radius:4px}.chatbubble.user{background:#111;color:white;margin-left:auto;border-bottom-right-radius:4px}.chatinput{display:flex;gap:8px;align-items:center;border:1px solid #ddd;border-radius:15px;padding:7px 8px 7px 12px;margin-top:15px}.chatinput input{flex:1;min-width:0;border:0;outline:0;font-size:12px}.send{width:34px;height:34px;border-radius:50%;border:0;background:#111;color:#fff;font-weight:700}.progress{height:6px;border-radius:9px;background:#e9e9e9;overflow:hidden}.progress span{display:block;height:100%;background:#111;border-radius:9px}.node{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid #e7e7e7;border-radius:12px;margin:8px 0}.node .dot{width:9px;height:9px;border:2px solid #111;border-radius:50%}.flowbox{padding:11px 13px;border:1px solid #bbb;border-radius:11px;text-align:center;font-size:11px;font-weight:650;background:#fff;width:78%;margin:0 auto}.flowarrow{text-align:center;color:#777;height:19px;font-size:14px}.check{display:flex;align-items:flex-start;gap:8px;font-size:11px;color:#555;line-height:1.4;margin:10px 0}.check input{accent-color:#111;margin-top:1px}.footnote{margin-top:13px;font-size:10px;color:#888;line-height:1.45;text-align:center}.back{border:0;background:none;padding:0;font-size:22px;color:#111}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.chips button{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:20px;padding:7px 11px;font-size:10px;color:#666}.chips button.active{background:#111;color:#fff;border-color:#111}.price{font-size:24px;font-weight:760;letter-spacing:-.6px}.star{letter-spacing:1px}.tag{font-size:9px;border:1px solid #ddd;padding:4px 7px;border-radius:6px;color:#555}.bannerline{height:4px;width:36px;background:#bbb;border-radius:9px;margin:0 auto 16px}.modalveil{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:13px 20px 34px;max-height:80%;overflow:auto}.sheet h3{margin:0 0 8px;font-size:18px}.toast{position:absolute;top:62px;left:20px;right:20px;background:#111;color:#fff;border-radius:12px;padding:12px 14px;font-size:11px;z-index:25;box-shadow:0 5px 20px #0002}.empty{border:1px dashed #ccc;border-radius:17px;padding:26px 18px;text-align:center}.empty .symbol{font-size:28px;margin-bottom:11px}.smallcaps{font-size:9px;letter-spacing:1px;font-weight:700;color:#999;text-transform:uppercase}.screenhead{display:flex;align-items:center;gap:12px;margin-bottom:19px}.screenhead .headcopy{flex:1}.large-w{width:84px;height:84px;border-radius:24px;object-fit:cover}.screen-name{font-size:10px;color:#888;letter-spacing:.2px}

<body>
<div class="workbench">
<aside class="side">
 <div class="brand"><img src="assets/wiseman-logo.png" alt="Wiseman W logo"><div><strong>Drop by Wiseman</strong><small>iOS design prototype · monochrome</small></div></div>
 <div class="navgroup"><label>01 · First launch</label>
  <button class="navitem active" data-screen="appstore"><span>◫</span>App Store listing</button>

 </div>
 <div class="navgroup"><label>02 · Primary workspace</label>

 </div>
 <div class="navgroup"><label>03 · Create Drop Studio</label>
  <button class="navitem" data-screen="create"><span>＋</span>Start a Drop</button>
  <button class="navitem" data-screen="interview"><span>◌</span>Wiseman interview</button>
  <button class="navitem" data-screen="compile"><span>◎</span>Compile progress</button>
  <button class="navitem" data-screen="knowledge"><span>⌘</span>Knowledge Graph</button>
  <button class="navitem" data-screen="node"><span>◇</span>Node detail</button>
  <button class="navitem" data-screen="capabilities"><span>▤</span>Capabilities</button>
  <button class="navitem" data-screen="execution"><span>⌁</span>Execution Graph</button>
  <button class="navitem" data-screen="integrations"><span>⛭</span>Integrations</button>
  <button class="navitem" data-screen="tests"><span>✓</span>Test suite</button>
  <button class="navitem" data-screen="pricing"><span>＄</span>Pricing</button>
  <button class="navitem" data-screen="publish"><span>↥</span>Publish</button>
 </div>
 <div class="navgroup"><label>04 · Ask and discover</label>
  <button class="navitem" data-screen="ask"><span>✧</span>Ask Anything</button>
  <button class="navitem" data-screen="plan"><span>☷</span>Execution plan</button>
  <button class="navitem" data-screen="result"><span>▣</span>Answer + provenance</button>
  <button class="navitem" data-screen="store"><span>▦</span>Drop Store</button>
  <button class="navitem" data-screen="detail"><span>◈</span>Drop details</button>
  <button class="navitem" data-screen="creator"><span>◎</span>Creator profile</button>
 </div>
 <div class="navgroup"><label>05 · Account and earnings</label>
  <button class="navitem" data-screen="more"><span>•••</span>More</button>
  <button class="navitem" data-screen="profile"><span>◉</span>My profile</button>
  <button class="navitem" data-screen="earnings"><span>＄</span>Earnings</button>
  <button class="navitem" data-screen="payouts"><span>⇧</span>Payout methods</button>
  <button class="navitem" data-screen="sharing"><span>↗</span>Sharing & permissions</button>
  <button class="navitem" data-screen="settings"><span>⚙</span>Settings</button>
  <button class="navitem" data-screen="security"><span>▣</span>Privacy & security</button>
 </div>
 <div class="side-foot">Interactive concept only. No real authentication, payment, API or backend actions are performed. Screen content is illustrative.</div>
</aside>
<main class="stage">
 <div class="device-col"><div class="device-label" id="screen-label">App Store listing · pre-install</div>
  <div class="phone"><div class="screen" id="screen"></div><div class="home-indicator"></div></div>
 </div>
</main>
</div>
<script>
const LOGO='assets/wiseman-logo.png';
let current='appstore', selectedTab='space', toastTimer=null;
const tabs=[['ask','✧','Ask'],['store','▦','Store'],['dashboard','◫','My Space'],['more','•••','More']];
function status(){return `<div class="status"><span>9:41</span><span class="island"></span><span class="status-right">● ◔ ▰</span></div>`}
function logo(size='28'){return `<img class="mini-logo" style="width:${size}px;height:${size}px" src="${LOGO}" alt="W">`}
function avatar(initial='M'){return `<div class="avatar">${initial}</div>`}
function appbar(title='',right=true){return `<div class="appbar"><div class="appbar-left">${logo()}<span class="appbar-title">${title||'Wiseman'}</span></div>${right?`<div class="row"><button class="iconbtn" onclick="go('more')">♧</button>${avatar()}</div>`:''}</div>`}
function tabsHtml(active){return `<div class="tabbar">${tabs.map(([id,ic,l])=>`<button class="tab ${active===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span><span>${l}</span></button>`).join('')}</div>`}
function shell(body,{tab=null,title='',right=true,back=null}={}){return `${status()}<div class="screenbody">${back?`<div class="screenhead"><button class="back" onclick="go('${back}')">‹</button><div class="headcopy"><div class="appbar-title">${title}</div></div><button class="iconbtn" onclick="showToast('More actions')">•••</button></div>`:appbar(title,right)}${body}</div>${tab?tabsHtml(tab):''}`}
function btn(text,fn,kind=''){return `<button class="btn ${kind}" onclick="${fn}">${text}</button>`}
function field(label,placeholder,type='text'){return `<div class="field"><label>${label}</label><input class="input" type="${type}" placeholder="${placeholder}"></div>`}
function metric(value,label){return `<div class="metric"><strong>${value}</strong><span>${label}</span></div>`}
function dropRow(name,desc,meta='Draft · Updated today',symbol='D'){return `<div class="listrow" onclick="go('detail')"><div class="glyph">${symbol}</div><div class="grow"><div class="rowtitle">${name}</div><div class="rowsub">${desc}</div><div class="tiny">${meta}</div></div><span class="chev">›</span></div>`}
function stepper(active){let steps=['Describe','Knowledge','Build','Test','Publish'];return `<div class="stepper">${steps.map((s,i)=>`<div class="step ${i===active?'active':''}"><b>${i+1}</b>${s}</div>`).join('')}</div>`}
const screens={
appstore:()=>`${status()}<div class="screenbody"><div class="row between"><span class="muted" style="font-size:12px">‹ Search</span><span class="tiny">•••</span></div><div style="height:24px"></div><div class="row" style="align-items:flex-start;gap:15px">${logo('82')}<div class="grow"><div class="h2" style="margin:4px 0">Drop by Wiseman</div><div class="sub">Turn expertise into software.</div><div class="tiny" style="margin-top:7px">Productivity · Business</div></div><button class="btn small inline" onclick="go('launch')">GET</button></div><div class="divider"></div><div class="row between"><div><b style="font-size:18px">—</b><div class="tiny">Rating pending</div></div><div><b style="font-size:18px">—</b><div class="tiny">Age rating TBD</div></div><div><b style="font-size:18px">—</b><div class="tiny">Category TBD</div></div></div><div class="section"><div class="h2">You explain what you know.</div><div class="h2">Wiseman builds the software.</div><p class="sub">Create. Share. Earn.</p></div><div class="card soft" style="margin-top:18px"><div class="h3">Build a Drop from your expertise</div><p class="sub" style="margin-top:6px">Compile knowledge into reusable software capabilities.</p><div class="row" style="margin-top:16px;justify-content:space-around">${['Create','Discover','Earn'].map(x=>`<span class="pill outline">${x}</span>`).join('')}</div></div><div class="section"><div class="h3">Preview screenshots</div><div class="row" style="margin-top:10px">${['My Space','Create Drop','Ask Anything'].map(x=>`<div class="card soft" style="height:110px;flex:1;padding:9px"><div class="tiny">${x}</div><div class="h3" style="margin-top:15px">W.</div></div>`).join('')}</div></div></div>${`<div style="padding:12px 22px 24px">${btn('GET · INSTALL APP',"go('launch')")}</div>`}`,
launch:()=>`${status()}<div class="screenbody dark-screen" style="display:flex;align-items:center;justify-content:center;text-align:center"><div>${`<img src="${LOGO}" style="width:104px;height:104px;border-radius:28px;display:block;margin:0 auto 20px">`}<div style="font-size:25px;font-weight:760;letter-spacing:-.7px">Wiseman</div><div style="font-size:11px;color:#aaa;margin-top:8px">Drop by Wiseman</div></div></div><div style="padding:10px 22px 35px;background:#050505">${btn('Continue',"go('welcome')")}</div>`,
welcome:()=>`${status()}<div class="screenbody" style="display:flex;flex-direction:column;justify-content:space-between"><div style="padding-top:64px;text-align:center">${`<img src="${LOGO}" style="width:82px;height:82px;border-radius:23px">`}<div style="height:42px"></div><div class="h1">You explain<br>what you know.</div><div class="h1" style="font-size:26px;color:#777">Wiseman builds<br>the software.</div><p class="sub" style="margin:17px auto;max-width:245px">Create reusable capabilities from your expertise. Share them anywhere. Earn when they are used.</p></div><div><div class="row" style="justify-content:center;gap:5px;margin-bottom:22px"><span class="pill dark">●</span><span class="pill">○</span><span class="pill">○</span></div>${btn('Get started',"go('signup')")}<div style="height:10px"></div>${btn('I already have an account',"go('signin')",'secondary')}</div></div>`,
signin:()=>shell(`<div style="text-align:center;padding:20px 0 12px">${`<img src="${LOGO}" style="width:58px;height:58px;border-radius:16px">`}<div class="h2" style="margin-top:14px">Welcome back.</div><p class="sub">Sign in to continue to Wiseman.</p></div>${field('Email address','you@example.com','email')}${field('Password','Enter your password','password')}<div class="row between" style="margin:5px 0 18px"><label class="check" style="margin:0"><input type="checkbox">Remember me</label><button class="link" onclick="go('forgot')">Forgot password?</button></div>${btn('Sign in',"go('dashboard')")}<div class="row" style="margin:18px 0;gap:12px"><div class="divider" style="flex:1"></div><span class="tiny">OR</span><div class="divider" style="flex:1"></div></div>${btn('Continue with Apple',"go('dashboard')",'secondary')}<p class="footnote">New to Wiseman? <button class="link" onclick="go('signup')">Create account</button></p>`,{back:'welcome',title:'Sign in',right:false}),
signup:()=>shell(`<div class="h1">Create your<br>account.</div><p class="sub">Your personal space will be ready right after sign up.</p>${field('Full name','Your name')}${field('Email address','you@example.com','email')}${field('Password','At least 12 characters','password')}<label class="check"><input type="checkbox">I agree to the Terms of Service and Privacy Policy.</label>${btn('Create account',"go('verify')")}<div class="row" style="margin:16px 0;gap:12px"><div class="divider" style="flex:1"></div><span class="tiny">OR</span><div class="divider" style="flex:1"></div></div>${btn('Continue with Apple',"go('dashboard')",'secondary')}<p class="footnote">Already have an account? <button class="link" onclick="go('signin')">Sign in</button></p>`,{back:'welcome',title:'Create account',right:false}),
verify:()=>shell(`<div style="padding:48px 0 18px;text-align:center"><div class="glyph" style="margin:auto;width:64px;height:64px;font-size:25px">✉</div><div class="h1" style="margin-top:20px">Check your<br>inbox.</div><p class="sub">We sent a verification link to your email address.</p></div>${field('Verification code','Enter 6-digit code','number')}${btn('Verify email',"go('dashboard')")}<p class="footnote">Didn't receive it? <button class="link" onclick="showToast('A new verification email has been requested.')">Resend email</button></p>`,{back:'signup',title:'Verify email',right:false}),
forgot:()=>shell(`<div class="h1">Reset your<br>password.</div><p class="sub">Enter the email address linked to your account.</p>${field('Email address','you@example.com','email')}${btn('Send reset link',"showToast('Reset link requested.');go('signin')")}<p class="footnote">You can return to <button class="link" onclick="go('signin')">Sign in</button>.</p>`,{back:'signin',title:'Forgot password',right:false}),
dashboard:()=>shell(`<div class="row between" style="margin-bottom:18px"><button class="pill outline" onclick="go('workspace')">◉ Personal Space⌄</button><div class="row"><button class="iconbtn" onclick="showToast('No new notifications')">♧</button>${avatar()}</div></div><div class="eyebrow">Thursday, 19 November</div><div class="h1" style="margin-top:5px">Your space.<br>Your expertise.</div><p class="sub">Turn what you know into software people can use.</p><div class="section hero"><div class="eyebrow" style="color:#bbb">Creator overview</div><div class="row between" style="margin-top:11px"><div><div class="tiny" style="color:#bbb">Total earnings</div><div style="font-size:27px;font-weight:760;letter-spacing:-1px">$0.00</div></div><div style="font-size:28px">↗</div></div><div class="tiny" style="color:#bbb;margin-top:7px">Your first published Drop starts here.</div></div><div class="metricgrid section">${metric('0','Drops')}${metric('0','Executions')}${metric('0','Customers')}${metric('—','Average rating')}</div><div class="section">${btn('＋  Create a Drop',"go('create')")}</div><div class="section"><div class="sectionhead"><h3 class="h3">Your Drops</h3><button class="link" onclick="showToast('All Drops view')">See all</button></div><div class="empty"><div class="symbol">◈</div><div class="h3">Your first Drop starts here.</div><p class="sub" style="margin:7px 0 14px">Explain your expertise. Wiseman will help turn it into reusable software.</p>${btn('Create your first Drop',"go('create')",'small')}</div></div>`,{tab:'dashboard',title:'My Space',right:false}),
workspace:()=>shell(`<div class="h1">Your spaces.</div><p class="sub">Switch between personal work and teams.</p><div class="section"><div class="card"><div class="row"><div class="glyph">◉</div><div class="grow"><div class="rowtitle">Personal Space</div><div class="rowsub">Just for you</div></div><span class="pill dark">Current</span></div></div><div class="listrow" onclick="showToast('ABC Finance selected');go('dashboard')"><div class="glyph">AF</div><div class="grow"><div class="rowtitle">ABC Finance</div><div class="rowsub">Team · 8 members</div></div><span class="chev">›</span></div><div class="listrow" onclick="showToast('XYZ Consulting selected');go('dashboard')"><div class="glyph">XC</div><div class="grow"><div class="rowtitle">XYZ Consulting</div><div class="rowsub">Team · 12 members</div></div><span class="chev">›</span></div></div><div class="section">${btn('＋  Create a workspace',"go('newworkspace')",'secondary')}</div>`,{back:'dashboard',title:'Switch workspace'}),
newworkspace:()=>shell(`<div class="h1">Create a<br>workspace.</div><p class="sub">Bring people together to create and manage Drops.</p>${field('Workspace name','e.g. ABC Finance')}${field('Short description','What does your team do?')}<div class="field"><label>Workspace type</label><select class="select"><option>Team</option><option>Business</option></select></div><div class="card soft"><div class="row"><span>◉</span><div class="grow"><div class="rowtitle">Workspace-owned Drops</div><div class="rowsub">The workspace manages shared Drops. Individual contributions and IP remain traceable.</div></div></div></div><div style="height:18px"></div>${btn('Create workspace',"go('invite')")}`,{back:'workspace',title:'New workspace'}),
invite:()=>shell(`<div class="h1">Bring your<br>people in.</div><p class="sub">Invite collaborators to your workspace. You can do this later.</p>${field('Email addresses','name@company.com, teammate@company.com','email')}<div class="field"><label>Default role</label><select class="select"><option>Editor</option><option>Viewer</option><option>Admin</option></select></div><div class="card soft"><div class="rowtitle">Roles can be changed later</div><div class="rowsub">Owner · Admin · Publisher · Editor · Viewer</div></div><div style="height:18px"></div>${btn('Send invitations',"go('dashboard')")}<div style="height:8px"></div>${btn('Skip for now',"go('dashboard')",'secondary')}`,{back:'newworkspace',title:'Invite members'}),
create:()=>shell(`${stepper(0)}<div class="h1">What do you<br>want to build?</div><p class="sub">Start with the work you know. Describe it in your own words.</p>${field('Drop title','e.g. Financial Analysis') }<div class="field"><label>What should it help people do?</label><textarea class="textarea" placeholder="Describe the expertise, work or decisions you repeat..."></textarea></div><div class="field"><label>Category</label><select class="select"><option>Select a category</option><option>Finance</option><option>Accounting</option><option>Legal</option><option>Human resources</option><option>Engineering</option><option>Healthcare</option><option>Marketing</option><option>Other</option></select></div><div class="card soft"><div class="rowtitle">No workflow diagram needed.</div><div class="rowsub">Wiseman will interview you, discover capabilities and structure the knowledge.</div></div><div style="height:17px"></div>${btn('Start with Wiseman',"go('interview')")}<p class="footnote">Drafts are private by default.</p>`,{back:'dashboard',title:'Create Drop',right:false}),
interview:()=>shell(`<div class="row between"><span class="pill">Finance Analysis · Draft</span><span class="tiny">Interview 1 of 4</span></div><div class="h1" style="margin-top:17px">Let's understand<br>your expertise.</div><p class="sub">Wiseman asks focused questions. You can answer naturally, upload source material or skip and return.</p><div class="chatbubble wiseman">Walk me through how you evaluate a company's financial health. What do you look at first?</div><div class="chatbubble user">I start with the income statement, balance sheet and cash flow. Then I calculate key ratios and compare them with the industry.</div><div class="chatbubble wiseman">Which ratios matter most to you, and what thresholds make you investigate further?</div><div class="chatbubble user" style="background:#f7f7f7;color:#777">Your response will appear here…</div><div class="section"><div class="row"><span class="pill outline">＋ Add documents</span><span class="pill outline">＋ Add examples</span></div></div><div class="chatinput"><input placeholder="Describe how you work…"><button class="send" onclick="showToast('Response added to interview draft')">↑</button></div><div style="height:14px"></div>${btn('Review captured expertise',"go('compile')")}`,{back:'create',title:'Wiseman interview',right:false}),
compile:()=>`${status()}<div class="screenbody dark-screen" style="display:flex;justify-content:center;flex-direction:column;padding:36px"><div class="eyebrow" style="color:#aaa">Wiseman compiler</div><div class="h1" style="font-size:35px;margin-top:12px">Building your<br>Drop.</div><p style="font-size:13px;line-height:1.5;color:#aaa">Turning your knowledge into a structured, testable software capability.</p><div style="height:30px"></div><div style="font-size:50px;font-weight:750">78%</div><div class="progress" style="background:#333;margin:10px 0 20px"><span style="width:78%;background:#fff"></span></div>${['Extracting expertise','Building Knowledge Graph','Discovering capabilities','Preparing execution logic'].map((x,i)=>`<div class="row" style="margin:12px 0;font-size:12px;color:${i<3?'#fff':'#777'}"><span>${i<3?'✓':'○'}</span>${x}</div>`).join('')}<p style="font-size:10px;color:#777;margin-top:26px">You can leave this screen. Your draft will be saved.</p>${btn('View compiled knowledge',"go('knowledge')",'secondary')}</div>`,
knowledge:()=>shell(`<div class="row between"><div><div class="h1">Knowledge Graph</div><p class="sub">Finance Analysis · v0.1 draft</p></div><button class="iconbtn" onclick="showToast('Search nodes')">⌕</button></div><div class="chips"><button class="active">Nodes</button><button>Relationships</button><button>Rules</button><button>Evidence</button></div><div class="section"><div class="sectionhead"><h3 class="h3">Captured knowledge</h3><span class="pill">42 nodes</span></div>${[['Financial statements','12 nodes · 18 relations'],['Revenue quality','8 nodes · 11 relations'],['Profitability ratios','7 nodes · 9 relations'],['Liquidity risk','6 nodes · 8 relations'],['Valuation methods','9 nodes · 14 relations']].map((x,i)=>`<div class="listrow" onclick="go('node')"><div class="glyph">${['▤','↗','%','!','◇'][i]}</div><div class="grow"><div class="rowtitle">${x[0]}</div><div class="rowsub">${x[1]}</div></div><span class="chev">›</span></div>`).join('')}</div><div class="section"><div class="card soft"><div class="row between"><div><div class="rowtitle">Graph visualization</div><div class="rowsub">Explore how knowledge connects.</div></div><button class="btn secondary small inline" onclick="showToast('Graph visualization opened')">View graph</button></div></div></div><div class="section">${btn('＋ Add knowledge node',"go('node')")}${btn('Continue to capabilities',"go('capabilities')",'secondary')}</div>`,{back:'interview',title:'Knowledge Graph',right:false}),
node:()=>shell(`<div class="eyebrow">Knowledge node · FIN-012</div><div class="h1" style="margin-top:7px">Current ratio.</div><p class="sub">A liquidity measure captured from your expertise.</p>${field('Definition','Current assets divided by current liabilities')}${field('Formula','Current Assets / Current Liabilities')}<div class="field"><label>Interpretation rule</label><textarea class="textarea">A ratio below 1.0 may indicate short-term liquidity pressure. Interpret against industry context.</textarea></div><div class="card soft"><div class="row between"><span class="rowtitle">Source attribution</span><span class="pill">Creator input</span></div><div class="rowsub">Interview · Finance Analysis · Draft v0.1</div></div><div class="section">${btn('Save node',"go('knowledge')")}${btn('Add relationship',"showToast('Relationship editor opened')",'secondary')}</div>`,{back:'knowledge',title:'Edit node',right:false}),
capabilities:()=>shell(`<div class="h1">Your capabilities.</div><p class="sub">Wiseman found multiple ways your expertise can be used. Review and choose what belongs in this Drop.</p>${[['Financial health analysis','Evaluate financial statements and key ratios.'],['Company valuation','Apply valuation methods and comparables.'],['Risk assessment','Identify financial risk indicators.'],['Candidate assessment','Evaluate finance-role competencies from supplied evidence.']].map((x,i)=>`<div class="card" style="margin:10px 0"><div class="row"><div class="glyph">${['▤','◇','!','✓'][i]}</div><div class="grow"><div class="rowtitle">${x[0]}</div><div class="rowsub">${x[1]}</div></div><input type="checkbox" ${i<3?'checked':''} style="accent-color:#111;width:17px;height:17px"></div><div class="tiny" style="margin:8px 0 0 49px">${i===3?'Requires role-specific fairness review':'Uses shared Finance knowledge'}</div></div>`).join('')}<div class="section">${btn('Confirm capabilities',"go('execution')")}${btn('Suggest another capability',"showToast('Wiseman will interview you about the new use case')",'secondary')}</div>`,{back:'knowledge',title:'Capabilities',right:false}),
execution:()=>shell(`<div class="h1">Execution Graph.</div><p class="sub">How Financial Health Analysis runs. This is separate from what the Drop knows.</p><div class="section"><div class="flowbox">Input · financial statements</div><div class="flowarrow">↓</div><div class="flowbox">Validate input schema</div><div class="flowarrow">↓</div><div class="flowbox">Extract financial values</div><div class="flowarrow">↓</div><div class="flowbox">Calculate ratios</div><div class="flowarrow">↓</div><div class="flowbox">Apply creator rules</div><div class="flowarrow">↓</div><div class="flowbox">Generate evidence-backed output</div></div><div class="card soft section"><div class="rowtitle">Execution guarantee</div><div class="rowsub">Same version + same input + same pinned dependencies = same deterministic output.</div></div><div class="section">${btn('Configure integrations',"go('integrations')")}${btn('Review execution graph',"showToast('Graph editor opened')",'secondary')}</div>`,{back:'capabilities',title:'Execution Graph',right:false}),
integrations:()=>shell(`<div class="h1">Connect what it needs.</div><p class="sub">Choose where data comes from and which credentials are used.</p><div class="card" style="margin:12px 0"><div class="row"><div class="glyph">⌘</div><div class="grow"><div class="rowtitle">Creator-managed</div><div class="rowsub">Use integrations connected by this workspace.</div></div><span class="tag">Optional</span></div></div><div class="card" style="margin:12px 0"><div class="row"><div class="glyph">↗</div><div class="grow"><div class="rowtitle">Buyer-connected</div><div class="rowsub">Ask each buyer to authorize their own data.</div></div><span class="tag">Optional</span></div></div><div class="section"><div class="h3">Available connections</div>${[['API connection','Scoped HTTP API'],['MCP server','External tools'],['Database','PostgreSQL / MongoDB'],['Search','Live web search'],['Custom code','Sandboxed package']].map((x,i)=>`<div class="listrow" onclick="showToast('${x[0]} setup opened')"><div class="glyph">${['↗','⌘','▤','⌕','{}'][i]}</div><div class="grow"><div class="rowtitle">${x[0]}</div><div class="rowsub">${x[1]}</div></div><span class="chev">＋</span></div>`).join('')}</div><p class="footnote">Credentials are stored in an encrypted secret manager, never in the KG or source code.</p><div class="section">${btn('Continue to tests',"go('tests')")}</div>`,{back:'execution',title:'Integrations',right:false}),
tests:()=>shell(`<div class="h1">Prove it works.</div><p class="sub">Wiseman generates tests from your rules. Add examples with expected results.</p><div class="row between section"><div class="h3">Test suite</div><span class="pill">12 cases</span></div>${[['Valid statements','Input validation'],['Low liquidity scenario','Rule boundary'],['Missing cash-flow data','Missing field'],['Negative revenue','Edge case']].map((x,i)=>`<div class="listrow"><div class="glyph">${i===2?'!':'✓'}</div><div class="grow"><div class="rowtitle">${x[0]}</div><div class="rowsub">${x[1]}</div></div><span class="pill">${i===2?'Review':'Ready'}</span></div>`).join('')}<div class="card soft section"><div class="row between"><div><div class="rowtitle">Expected vs actual</div><div class="rowsub">Each test checks output against an expected result.</div></div><span class="pill">Required</span></div></div><div class="section">${btn('Run all tests',"go('testresult')")}${btn('Add test case',"showToast('New test case editor opened')",'secondary')}</div>`,{back:'integrations',title:'Testing',right:false}),
testresult:()=>shell(`<div class="row between"><div><div class="h1">Test results.</div><p class="sub">Build 0.1.3 · Completed just now</p></div><span class="pill dark">Passed</span></div><div class="darkcard section"><div class="row between"><div><div class="tiny" style="color:#aaa">Tests passed</div><div style="font-size:35px;font-weight:760">11 / 12</div></div><div style="font-size:33px">✓</div></div><div class="progress" style="background:#444;margin-top:14px"><span style="width:92%;background:#fff"></span></div></div><div class="section"><div class="h3">Needs attention</div><div class="listrow"><div class="glyph">!</div><div class="grow"><div class="rowtitle">Missing cash-flow data</div><div class="rowsub">Expected graceful fallback; actual output failed validation.</div></div><span class="pill">Failed</span></div></div><div class="card soft section"><div class="rowtitle">Repair with Wiseman</div><div class="rowsub">Wiseman can suggest a correction. Changes create a new build and rerun affected tests.</div></div><div class="section">${btn('Ask Wiseman to fix',"showToast('Repair proposal generated');go('tests')")}${btn('Continue with passing build',"go('pricing')",'secondary')}</div>`,{back:'tests',title:'Test results',right:false}),
pricing:()=>shell(`<div class="h1">Set your price.</div><p class="sub">Wiseman estimates a fair price using execution cost, value, demand and comparable capabilities.</p><div class="card section"><div class="eyebrow">Wiseman recommendation</div><div class="price" style="margin:8px 0">$2.00 <span class="sub">/ execution</span></div><div class="rowsub">Suggested range: $1.50 – $2.75</div><div class="divider"></div><div class="row between"><span class="rowsub">Estimated execution cost</span><b style="font-size:12px">$0.18</b></div><div class="row between" style="margin-top:9px"><span class="rowsub">Creator share (85%)</span><b style="font-size:12px">$1.70</b></div><div class="row between" style="margin-top:9px"><span class="rowsub">Wiseman (15%)</span><b style="font-size:12px">$0.30</b></div></div>${field('Your execution price (USD)','$2.00','number')}<div class="field"><label>Billing model</label><select class="select"><option>Per execution</option><option>Per result</option><option>Subscription</option><option>Volume bundle</option></select></div><div class="card soft"><div class="rowtitle">Price transparency</div><div class="rowsub">Buyers see capability price and separately disclosed execution costs before approval.</div></div><div class="section">${btn('Review publication',"go('publish')")}</div>`,{back:'testresult',title:'Pricing',right:false}),
publish:()=>shell(`<div class="h1">Ready to publish?</div><p class="sub">Review what people can see, use and reuse.</p><div class="card section"><div class="row between"><div><div class="rowtitle">Discoverability</div><div class="rowsub">Can people find this Drop?</div></div><select class="select" style="width:116px;padding:9px"><option>Public</option><option>Private</option></select></div><div class="divider"></div><div class="row between"><div><div class="rowtitle">Execution</div><div class="rowsub">Who can run it?</div></div><select class="select" style="width:116px;padding:9px"><option>Public</option><option>Workspace</option><option>Invited</option></select></div><div class="divider"></div><div class="row between"><div><div class="rowtitle">KG and workflow inspection</div><div class="rowsub">Allow visibility into structure.</div></div><select class="select" style="width:116px;padding:9px"><option>Hidden</option><option>Allowed</option></select></div><div class="divider"></div><div class="row between"><div><div class="rowtitle">Forking</div><div class="rowsub">Allow licensed reuse.</div></div><select class="select" style="width:116px;padding:9px"><option>Disabled</option><option>Allowed</option></select></div></div><div class="card soft section"><div class="rowtitle">Contributor and IP declaration</div><div class="rowsub">Confirm rights basis, contributors, license terms and creator-pool allocation before publication.</div><label class="check"><input type="checkbox">I have the rights or permissions required to publish this material.</label></div><div class="section">${btn('Publish Drop',"go('dashboard');showToast('Demo: Drop published')")}${btn('Save as draft',"go('dashboard')",'secondary')}</div>`,{back:'pricing',title:'Publish Drop',right:false}),
ask:()=>shell(`<div class="h1">Ask anything.</div><p class="sub">Describe what you need. Wiseman will find capabilities across Drops.</p><div class="card" style="margin-top:19px"><textarea class="textarea" style="border:0;padding:0;min-height:106px" placeholder="What do you want to accomplish?"></textarea><div class="row between"><span class="tiny">Attach files · Add context</span><button class="send" onclick="go('plan')">↑</button></div></div><div class="section"><div class="sectionhead"><h3 class="h3">Try asking</h3></div>${['Evaluate this company’s financial health','Compare two companies','Review a contract for risk','Assess a finance candidate'].map(x=>`<div class="listrow" onclick="go('plan')"><div class="grow"><div class="rowtitle">${x}</div></div><span class="chev">↗</span></div>`).join('')}</div><div class="section"><div class="card soft"><div class="rowtitle">Your workspace context</div><div class="rowsub">Personal Space · You control connected data and spending.</div></div></div>`,{tab:'ask',title:'Ask Anything'}),
plan:()=>shell(`<div class="eyebrow">Ask Anything · Plan</div><div class="h1" style="margin-top:6px">Here's how we'll<br>solve it.</div><div class="chatbubble user">Evaluate this company's financial health, valuation and risks.</div><div class="section"><div class="row between"><div class="h3">3 capabilities found</div><span class="pill">3 Drops</span></div>${[['Financial Health Analysis','Finance Expert','$2.00'],['Company Valuation','Valuation Studio','$4.50'],['Risk Assessment','Risk Analyst','$1.50']].map((x,i)=>`<div class="listrow"><div class="glyph">${i+1}</div><div class="grow"><div class="rowtitle">${x[0]}</div><div class="rowsub">${x[1]} · v1.2</div></div><b style="font-size:12px">${x[2]}</b></div>`).join('')}</div><div class="card soft section"><div class="row between"><div class="rowtitle">Estimated total</div><div class="price">$8.00</div></div><div class="rowsub">Execution costs, if any, are shown separately before approval.</div></div><div class="card section"><div class="rowtitle">Data and permissions</div><div class="rowsub">No external database access requested. Input file will be processed in an isolated execution.</div></div><div class="section">${btn('Approve & run · $8.00',"go('result')")}${btn('Edit execution plan',"go('ask')",'secondary')}</div>`,{tab:'ask',back:'ask',title:'Execution plan',right:false}),
result:()=>shell(`<div class="row between"><span class="pill dark">Completed</span><span class="tiny">Run · 19 Nov · 9:41 PM</span></div><div class="h1" style="margin-top:12px">Financial health<br>summary.</div><p class="sub">Three capabilities contributed to this result.</p><div class="card section"><div class="row between"><div><div class="eyebrow">Overall assessment</div><div class="h2" style="margin-top:6px">Moderate risk</div></div><div class="glyph" style="width:52px;height:52px;border-radius:50%;font-size:20px">!</div></div><div class="rowsub" style="margin-top:9px">Based on the supplied statements and the selected Drop versions. This is not investment advice.</div></div><div class="section"><div class="h3">Financial position</div><p class="sub" style="margin-top:8px">Liquidity is adequate, but operating cash flow has weakened over the last two periods.</p><div class="tiny" style="margin-top:8px">Source: Financial Health Analysis · v1.2 · Creator: Finance Expert</div></div><div class="divider"></div><div class="section"><div class="h3">Valuation and risks</div><p class="sub" style="margin-top:8px">The selected valuation range is sensitive to the earnings multiple. Debt maturity is the primary risk to investigate.</p><div class="tiny" style="margin-top:8px">Sources: Company Valuation · Risk Assessment</div></div><div class="card soft section"><div class="row between"><div class="rowtitle">Provenance receipt</div><button class="link" onclick="showToast('Full provenance receipt opened')">View</button></div><div class="rowsub">3 Drops · 3 creators · 3 versions · 8 licensed contributions</div></div><div class="section">${btn('Share result',"go('sharing')")}${btn('View full execution receipt',"showToast('Execution receipt opened')",'secondary')}</div>`,{tab:'ask',back:'ask',title:'Your answer',right:false}),
store:()=>shell(`<div class="h1">Drop Store.</div><p class="sub">Find software built from real expertise.</p><div class="search section" onclick="go('storesearch')">⌕ <span style="color:#aaa">Search by task, profession or capability</span></div><div class="section"><div class="sectionhead"><h3 class="h3">Browse categories</h3><button class="link" onclick="go('storesearch')">All</button></div><div class="chips">${['All','Finance','Accounting','Legal','People','Engineering','Health'].map((x,i)=>`<button class="${i===0?'active':''}" onclick="showToast('${x} category')">${x}</button>`).join('')}</div></div><div class="section hero"><div class="eyebrow" style="color:#bbb">Built by experts</div><h2>Build. Share.<br>Earn.</h2><p>Discover capabilities that turn professional knowledge into working software.</p><button class="btn secondary small inline" onclick="go('create')">Create a Drop</button></div><div class="section"><div class="sectionhead"><h3 class="h3">Popular for your work</h3><button class="link" onclick="go('storesearch')">See all</button></div>${dropRow('Financial Analysis Suite','Evaluate statements, ratios and risk.','4.8 ★ · 2.1K executions','F')}${dropRow('Contract Review','Identify clauses and obligations.','4.9 ★ · 890 executions','L')}${dropRow('Candidate Fit Assessment','Compare evidence to role criteria.','4.7 ★ · 1.4K executions','H')}</div>`,{tab:'store',title:'Drop Store'}),

};
function go(id){current=id; render(); if(window.innerWidth<900){document.querySelector('.phone').scrollIntoView({block:'nearest'});} }
function showToast(msg){let old=document.querySelector('.toast');if(old)old.remove();let n=document.createElement('div');n.className='toast';n.textContent=msg;document.querySelector('.screen').appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2200)}
function render(){let s=document.querySelector('#screen');let fn=screens[current]||screens.dashboard;s.innerHTML=fn()+`<div class="home-indicator"></div>`;document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.screen===current));document.querySelector('#screen-label').textContent=current.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase())+' · interactive concept';}
document.querySelectorAll('.navitem').forEach(b=>b.addEventListener('click',()=>go(b.dataset.screen)));
render();
</script>
