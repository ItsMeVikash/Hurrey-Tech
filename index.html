;border:1px solid #111;border-radius:13px;background:#111;color:white;font-size:13px;font-weight:730;margin:6px 0 0}.btn.secondary{background:white;color:#111}.btn.soft{background:#f4f4f4;border-color:#f4f4f4;color:#111}.btn.small{height:36px;width:auto;padding:0 13px;font-size:11px;border-radius:10px}.field{margin:13px 0}.field label{display:block;font-size:10px;font-weight:730;margin-bottom:6px}.input,.textarea,.select{width:100%;border:1px solid #dedede;border-radius:11px;padding:12px;background:#fff;font-size:12px;outline:none;color:#111}.textarea{min-height:86px;resize:vertical;line-height:1.45}.input:focus,.textarea:focus,.select:focus{border-color:#111;box-shadow:0 0 0 2px #eee}.card{border:1px solid #e7e7e7;border-radius:15px;padding:13px;background:white}.card.soft{background:#f5f5f5;border-color:#f5f5f5}.darkcard{background:#111;color:#fff;border-radius:16px;padding:16px}.divider{height:1px;background:#eee;margin:13px 0}.pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:20px;background:#f1f1f1;color:#555;font-size:9px;font-weight:700}.pill.dark{background:#111;color:white}.listrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.listrow:last-child{border:0}.glyph{width:36px;height:36px;border-radius:11px;background:#f1f1f1;display:grid;place-items:center;font-size:14px;font-weight:750;flex:none}.rowtitle{font-size:11px;font-weight:740;line-height:1.3}.rowsub{font-size:9px;color:#888;line-height:1.4;margin-top:3px}.chev{font-size:18px;color:#aaa}.metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:11px;border-radius:12px;background:#f5f5f5}.metric strong{display:block;font-size:19px;letter-spacing:-.5px}.metric span{font-size:9px;color:#888}.tabbar{height:69px;flex:none;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 7px 11px;background:#fff}.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-c <div class="workbench"><aside class="side"><div class="brand"><div class="brandmark"><img src="assets/wiseman.svg" alt="Wiseman logo"></div><div><strong>Drop by Wiseman</strong><small>Mobile product experience</small></div></div><div id="sidenav"></div><div class="sidefoot">Interactive product concept. Local state only; no real accounts, payments, publishing or external execution are connected.</div></aside><main class="stage"><div class="devicecol"><div class="devicelabel" id="screenlabel">My Space · interactive prototype</div><div class="phone"><div class="screen" id="screen"></div><div class="homeindicator"></div></div></div></main></div>
<script>
const groups=[['01 · First launch',[['appstore','App Store listing'],['launch','Launch'],['welcome','Welcome'],['signin','Sign in'],['signup','Create account'],['verify','Verify email'],['forgot','Forgot password']]],['02 · Primary workspace',[['dashboard','My Space'],['workspace','Workspaces'],['newworkspace','Create workspace'],['invite','Invite members']]],['03 · Create Drop Studio',[['create','Start a Drop'],['interview','Wiseman interview'],['compile','Compile progress'],['knowledge','Knowledge Graph'],['node','Node detail'],['capabilities','Capabilities'],['execution','Execution Graph'],['integrations','Integrations'],['tests','Test suite'],['testresult','Test results'],['pricing','Pricing'],['publish','Publish']]],['04 · Ask and discover',[['ask','Ask Anything'],['plan','Execution plan'],['result','Answer + provenance'],['store','Drop Store'],['storesearch','Search Drops'],['detail','Drop details'],['creator','Creator profile']]],['05 · Account and earnings',[['more','More'],['profile','My profile'],['earnings','Earnings'],['payouts','Payout methods'],['sharing','Sharing & permissions'],['settings','Settings'],['security','Privacy & security']]]];
const tabs=[['ask','✧','Ask'],['store','▦','Store'],['dashboard','◫','My Space'],['more','•••','More']];
let current='dashboard',toastTimer=null,selectedGraph='ratio',dropPublished=false,runCount=0,selectedCapability='Financial Health Analysis',state={dropName:'Financial Analysis',description:'Turn financial statements into evidence-backed analysis and decisions.',price:'2.00',profileName:'Vikash Kumar',profileEmail:'vikash@hurreytech.com',selectedNodes:['balance','revenue','ratio','cash','risk','valuation'],testsRun:false};
const $=id=>document.getElementById(id);
function status(){return `<div class="status"><span>9:41</span><span class="island"></span><span class="statusright">● ◔ ▰</span></div>`}
function brand(){return `<div class="appbrand"><span class="brandmini"><img src="assets/wiseman.svg" alt="Wiseman logo"></span><span>Wiseman</span></div>`}
function avatar(){return `<div class="avatar">VK</div>`}
function appbar(title='Wiseman'){return `<div class="appbar">${brand()}<div class="row"><button class="iconbtn" onclick="go('more')">♧</button>${avatar()}</div></div>`}
function tabsHtml(active){return `<div class="tabbar">${tabs.map(([id,ic,l])=>`<button class="tab ${active===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span><span>${l}</span></button>`).join('')}</div>`}
function shell(body,{tab=null,title='',back=null,app=true}={}){return `${status()}<div class="screenbody">${back?`<div class="screenhead"><button class="back" onclick="go('${back}')">‹</button><div class="headcopy">${title}</div><button class="iconbtn" onclick="showToast('More options')">•••</button></div>`:app?appbar():''}${body}</div>${tab?tabsHtml(tab):''}`}
function btn(label,action,kind=''){return `<button class="btn ${kind}" onclick="${action}">${label}</button>`}
function field(label,placeholder,type='text',value=''){return `<div class="field"><label>${label}</label><input class="input" type="${type}" placeholder="${placeholder}" value="${value}" onchange="fieldUpdate(this)"></div>`}
function stepper(n){return `<div class="stepper">${['Describe','Knowledge','Build','Test','Publish'].map((x,i)=>`<div class="step ${i===n?'active':''}"><b>${i+1}</b>${x}</div>`).join('')}</div>`}
function row(name,desc,icon='◇',action="go('detail')",meta=''){return `<div class="listrow" onclick="${action}"><div class="glyph">${icon}</div><div class="grow"><div class="rowtitle">${name}</div><div class="rowsub">${desc}</div>${meta?`<div class="tiny">${meta}</div>`:''}</div><span class="chev">›</span></div>`}
function metric(v,l){return `<div class="metric"><strong>${v}</strong><span>${l}</span></div>`}
function toast(msg){showToast(msg)}function showToast(msg){let old=document.querySelector('.toast');if(old)old.remove();let n=document.createElement('div');n.className='toast';n.textContent=msg;$('screen').appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),2100)}
function fieldUpdate(el){if(el.closest('.field')?.querySelector('label')?.textContent.includes('Drop title'))state.dropName=el.value}
function openSheet(title,body){let v=document.createElement('div');v.className='modalveil';v.innerHTML=`<div class="sheet"><div style="width:35px;height:4px;background:#ccc;border-radius:9px;margin:0 auto 15px"></div><h3>${title}</h3>${body}<button class="btn secondary" onclick="this.closest('.modalveil').remove()">Close</button></div>`;$('screen').appendChild(v)}
function graphSvg(kind){if(kind==='kg'){return `<svg class="flowcanvas" viewBox="0 0 340 270" role="img" aria-label="Interactive knowledge graph"><defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#aaa"/></marker></defs><path class="edge" d="M165 45L80 105M165 45L250 105M80 105L65 190M80 105L165 190M250 105L270 190M165 190L270 190" marker-end="url(#arr)"/><g class="graphnode ${selectedGraph==='balance'?'active':''}" onclick="selectGraph('balance')"><rect x="112" y="12" width="106" height="43" rx="9"/><text x="165" y="30" text-anchor="middle">Financial health</text><text class="subtext" x="165" y="43" text-anchor="middle">Core concept</text></g><g class="graphnode ${selectedGraph==='revenue'?'active':''}" onclick="selectGraph('revenue')"><rect x="18" y="85" width="124" height="43" rx="9"/><text x="80" y="103" text-anchor="middle">Revenue quality</text><text class="subtext" x="80" y="116" text-anchor="middle">Concept · 8 links</text></g><g class="graphnode ${selectedGraph==='ratio'?'active':''}" onclick="selectGraph('ratio')"><rect x="198" y="85" width="124" height="43" rx="9"/><text x="260" y="103" text-anchor="middle">Liquidity ratios</text><text class="subtext" x="260" y="116" text-anchor="middle">Rule · 6 links</text></g><g class="graphnode ${selectedGraph==='cash'?'active':''}" onclick="selectGraph('cash')"><rect x="12" y="172" width="106" height="43" rx="9"/><text x="65" y="190" text-anchor="middle">Cash flow</text><text class="subtext" x="65" y="203" text-anchor="middle">Evidence</text></g><g class="graphnode ${selectedGraph==='risk'?'active':''}" onclick="selectGraph('risk')"><rect x="130" y="172" width="106" height="43" rx="9"/><text x="183" y="190" text-anchor="middle">Risk signals</text><text class="subtext" x="183" y="203" text-anchor="middle">Decision rule</text></g><g class="graphnode ${selectedGraph==='valuation'?'active':''}" onclick="selectGraph('valuation')"><rect x="236" y="172" width="100" height="43" rx="9"/><text x="286" y="190" text-anchor="middle">Valuation</text><text class="subtext" x="286" y="203" text-anchor="middle">Capability</text></g><text x="170" y="250" text-anchor="middle" font-size="8" fill="#999">Select a node to inspect its connections</text></svg>`}
return `<svg class="flowcanvas" viewBox="0 0 340 310" role="img" aria-label="Interactive execution graph"><defs><marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#999"/></marker></defs><path class="edge" d="M170 43V70M170 110V132M78 232L170 250M262 232L170 250M170 132H78V192M170 132H262V192" marker-end="url(#arr2)"/><g class="graphnode ${selectedGraph==='input'?'active':''}" onclick="selectGraph('input')"><rect x="112" y="8" width="116" height="36" rx="9"/><text x="170" y="30" text-anchor="middle">Input contract</text></g><g class="graphnode ${selectedGraph==='validate'?'active':''}" onclick="selectGraph('validate')"><rect x="112" y="70" width="116" height="40" rx="9"/><text x="170" y="87" text-anchor="middle">Validate schema</text><text class="subtext" x="170" y="100" text-anchor="middle">Required fields</text></g><g class="graphnode ${selectedGraph==='extract'?'active':''}" onclick="selectGraph('extract')"><rect x="112" y="132" width="116" height="40" rx="9"/><text x="170" y="149" text-anchor="middle">Extract values</text><text class="subtext" x="170" y="162" text-anchor="middle">Normalize units</text></g><g class="graphnode ${selectedGraph==='ratios'?'active':''}" onclick="selectGraph('ratios')"><rect x="18" y="192" width="120" height="40" rx="9"/><text x="78" y="209" text-anchor="middle">Calculate ratios</text><text class="subtext" x="78" y="222" text-anchor="middle">Deterministic</text></g><g class="graphnode ${selectedGraph==='rules'?'active':''}" onclick="selectGraph('rules')"><rect x="202" y="192" width="120" height="40" rx="9"/><text x="262" y="209" text-anchor="middle">Apply rules</text><text class="subtext" x="262" y="222" text-anchor="middle">Creator logic</text></g><g class="graphnode ${selectedGraph==='output'?'active':''}" onclick="selectGraph('output')"><rect x="112" y="250" width="116" height="40" rx="9"/><text x="170" y="267" text-anchor="middle">Evidence output</text><text class="subtext" x="170" y="280" text-anchor="middle">Cited result</text></g></svg>`}
function selectGraph(id){selectedGraph=id;render()}
const screens={
appstore:()=>`${status()}<div class="screenbody"><div class="row between"><span class="sub">‹ Search</span><span class="tiny">•••</span></div><div style="height:25px"></div><div class="row" style="align-items:flex-start"><div class="brandmark" style="width:70px;height:70px;border-radius:15px"><img src="assets/wiseman.svg" alt="Wiseman logo"></div><div class="grow"><div class="h2">Drop by Wiseman</div><p class="sub">Turn expertise into software.</p><div class="tiny">Productivity · Business</div></div><button class="btn small" onclick="go('launch')">GET</button></div><div class="divider"></div><div class="h2">You explain what you know. Wiseman builds the software.</div><p class="sub">Create. Share. Earn.</p><div class="card soft section"><div class="h3">Build a Drop from your expertise</div><p class="sub" style="margin-top:6px">Compile knowledge into reusable software capabilities.</p></div><div class="section"><div class="h3">Preview</div><div class="metricgrid" style="margin-top:9px">${metric('01','Create')}${metric('02','Discover')}</div></div></div><div style="padding:10px 21px 24px">${btn('GET · INSTALL APP',"go('launch')")}</div>`,
launch:()=>`${status()}<div class="screenbody" style="background:#080808;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center"><div><div class="brandmark" style="margin:auto;width:90px;height:90px;border-radius:18px"><img src="assets/wiseman.svg" alt="Wiseman logo"></div><div style="font-size:26px;font-weight:780;margin-top:20px">Wiseman</div><div class="tiny" style="color:#aaa;margin-top:7px">Drop by Wiseman</div></div></div><div style="background:#080808;padding:12px 21px 32px">${btn('Continue',"go('welcome')")}</div>`,
welcome:()=>`${status()}<div class="screenbody" style="display:flex;flex-direction:column;justify-content:space-between"><div style="padding-top:62px"><div class="brandmark" style="width:70px;height:70px;border-radius:15px;margin-bottom:38px"><img src="assets/wiseman.svg" alt="Wiseman logo"></div><div class="h1">You explain<br>what you know.</div><div class="h1" style="font-size:25px;color:#777">Wiseman builds<br>the software.</div><p class="sub" style="margin-top:16px;max-width:260px">Create reusable capabilities from your expertise. Share them anywhere. Earn when they are used.</p></div><div>${btn('Get started',"go('signup')")}${btn('I already have an account',"go('signin')",'secondary')}</div></div>`,
signin:()=>shell(`<div style="padding:20px 0"><div class="h1">Welcome back.</div><p class="sub">Sign in to continue to Wiseman.</p></div>${field('Email address','you@example.com','email')}${field('Password','Enter your password','password')}<div class="row between"><label class="tiny"><input type="checkbox" class="toggle"> Remember me</label><button class="link" onclick="go('forgot')">Forgot password?</button></div>${btn('Sign in',"go('dashboard')")}${btn('Continue with Apple',"go('dashboard')",'secondary')}<p class="footer-note">New to Wiseman? <a onclick="go('signup')">Create account</a></p>`,{back:'welcome',title:'Sign in'}),
signup:()=>shell(`<div class="h1">Create your<br>account.</div><p class="sub">Your personal space will be ready after sign up.</p>${field('Full name','Your name')}${field('Email address','you@example.com','email')}${field('Password','At least 12 characters','password')}<label class="tiny"><input type="checkbox" class="toggle"> I agree to the Terms and Privacy Policy.</label>${btn('Create account',"go('verify')")}${btn('Continue with Apple',"go('dashboard')",'secondary')}`,{back:'welcome',title:'Create account'}),
verify:()=>shell(`<div class="h1">Check your<br>inbox.</div><p class="sub">We sent a verification link to your email address.</p>${field('Verification code','Enter 6-digit code','number')}${btn('Verify email',"go('dashboard')")}<p class="footer-note">Didn't receive it? <a onclick="showToast('Verification email requested')">Resend email</a></p>`,{back:'signup',title:'Verify email'}),
forgot:()=>shell(`<div class="h1">Reset your<br>password.</div><p class="sub">Enter the email address linked to your account.</p>${field('Email address','you@example.com','email')}${btn('Send reset link',"showToast('Reset link requested')")}`,{back:'signin',title:'Forgot password'}),
dashboard:()=>shell(`<div class="row between" style="margin-bottom:17px"><button class="pill" onclick="go('workspace')">◉ Personal Space⌄</button><div class="row"><button class="iconbtn" onclick="showToast('You are all caught up')">♧</button>${avatar()}</div></div><div class="eyebrow">Your workspace</div><div class="h1" style="margin-top:5px">Your space.<br>Your expertise.</div><p class="sub">Turn what you know into software people can use.</p><div class="darkcard section"><div class="eyebrow" style="color:#aaa">Create something useful</div><div class="h2" style="margin-top:8px">What do you know<br>that others need?</div><p class="sub" style="color:#bbb;margin:8px 0 13px">Build a Drop from your expertise, files and decision logic.</p>${btn('<span class="dropmark"><img src="assets/drop.svg" alt=""></span> Create a Drop',"go('create')",'secondary')}</div><div class="section"><div class="sectionhead"><h3 class="h3">Your Drops</h3><button class="link" onclick="go('more')">See all</button></div>${row('Financial Analysis','Turn statements into decisions','▤',"go('detail')",dropPublished?'Published · v1.0':'Draft · Updated today')}${row('Interview Intelligence','Structured candidate assessment','◎',"go('detail')",'Private · Draft')}</div><div class="section"><div class="sectionhead"><h3 class="h3">Continue building</h3><span class="pill">1 in progress</span></div>${row('Financial Analysis','Knowledge captured · 42 nodes','⌘',"go('knowledge')")}</div>`,{tab:'dashboard'}),
workspace:()=>shell(`<div class="h1">Your spaces.</div><p class="sub">Switch between personal work and teams.</p><div class="card section"><div class="row"><div class="glyph">◉</div><div class="grow"><div class="rowtitle">Personal Space</div><div class="rowsub">Just for you</div></div><span class="pill dark">Current</span></div></div>${row('Hurrey Tech','Team workspace · 4 members','◈',"showToast('Workspace selected')")}${btn('＋ Create workspace',"go('newworkspace')")}${btn('Invite members',"go('invite')",'secondary')}`,{back:'dashboard',title:'Workspaces'}),
newworkspace:()=>shell(`<div class="h1">Create a<br>workspace.</div><p class="sub">Bring people together to create and manage Drops.</p>${field('Workspace name','e.g. ABC Finance')}${field('Description','What does your team do?')}<div class="field"><label>Workspace type</label><select class="select"><option>Team</option><option>Business</option></select></div>${btn('Create workspace',"showToast('Workspace created locally');go('workspace')")}`,{back:'workspace',title:'Create workspace'}),
invite:()=>shell(`<div class="h1">Bring your<br>people in.</div><p class="sub">Invite collaborators to your workspace.</p>${field('Email addresses','name@company.com') }<div class="field"><label>Default role</label><select class="select"><option>Editor</option><option>Viewer</option><option>Admin</option></select></div>${btn('Send invitations',"showToast('Invitations queued locally')")}`,{back:'workspace',title:'Invite members'}),
create:()=>shell(`${stepper(0)}<div class="h1">What do you<br>want to build?</div><p class="sub">Start with the work you know. Describe it in your own words.</p>${field('Drop title','e.g. Financial Analysis','text',state.dropName)}<div class="field"><label>What should it help people do?</label><textarea class="textarea" placeholder="Describe the expertise, work or decisions you repeat..." onchange="state.description=this.value">${state.description}</textarea></div><div class="field"><label>Category</label><select class="select"><option>Finance</option><option>Operations</option><option>Legal</option><option>People</option><option>Engineering</option><option>Other</option></select></div>${btn('Continue · Capture knowledge',"go('interview')")}`,{back:'dashboard',title:'Create a Drop'}),
interview:()=>shell(`${stepper(1)}<div class="row between"><span class="pill">${state.dropName} · Draft</span><span class="tiny">Question 1 of 4</span></div><div class="h1" style="margin-top:14px">Let's understand<br>your expertise.</div><p class="sub">Wiseman asks focused questions. Answer naturally, add source material or return later.</p><div class="chatbubble">Walk me through how you evaluate a company's financial health. What do you look at first, and why?</div><div class="chatbubble user">I start with the balance sheet, income statement and cash flow. Then I look at liquidity, profitability and debt quality.</div><div class="field"><label>Your answer</label><textarea class="textarea" placeholder="Add detail, examples, thresholds or exceptions..."></textarea></div><div class="row between"><button class="link" onclick="showToast('Question skipped; you can return later')">Skip for now</button><button class="btn small" onclick="go('compile')">Continue</button></div><p class="footer-note">You control what knowledge is captured and what becomes shareable.</p>`,{back:'create',title:'Wiseman interview'}),
compile:()=>`${status()}<div class="screenbody" style="background:#090909;color:white;display:flex;flex-direction:column;justify-content:center;padding:32px"><div class="eyebrow" style="color:#aaa">Wiseman compiler</div><div class="h1" style="font-size:34px;margin-top:12px">Building your<br>Drop.</div><p style="font-size:12px;line-height:1.5;color:#aaa">Turning your knowledge into structured, testable capabilities.</p><div class="progress" style="background:#333;margin:20px 0 23px"><span style="width:82%;background:white"></span></div>${['Extracting expertise','Building Knowledge Graph','Discovering capabilities','Preparing execution logic'].map((x,i)=>`<div class="row" style="margin:11px 0;font-size:11px;color:${i<3?'white':'#777'}"><span>${i<3?'✓':'○'}</span>${x}</div>`).join('')}<div style="margin-top:28px">${btn('View compiled knowledge',"go('knowledge')",'secondary')}</div></div>`,
knowledge:()=>shell(`<div class="row between"><div><div class="h1">Knowledge Graph.</div><p class="sub">${state.dropName} · v0.1 draft</p></div><button class="iconbtn" onclick="openSheet('Find a knowledge node','Search concepts, rules or evidence')">⌕</button></div><div class="chips"><button class="active">Graph</button><button onclick="showToast('Relationship filter selected')">Relationships</button><button onclick="showToast('Rule filter selected')">Rules</button><button onclick="showToast('Evidence filter selected')">Evidence</button></div><div class="section"><div class="sectionhead"><h3 class="h3">What this Drop knows</h3><span class="pill">42 nodes · 66 links</span></div>${graphSvg('kg')}<div class="nodeinfo"><div class="row between"><b class="rowtitle">${({balance:'Financial health',revenue:'Revenue quality',ratio:'Liquidity ratios',cash:'Cash flow',risk:'Risk signals',valuation:'Valuation'})[selectedGraph]||'Knowledge node'}</b><span class="pill">Selected node</span></div><p class="rowsub">${({balance:'Central concept connecting financial statements, ratios and risk assessment.',revenue:'Revenue consistency, concentration, recognition and quality checks.',ratio:'Current ratio and quick ratio, interpreted with industry context.',cash:'Operating cash flow, cash conversion and working-capital movement.',risk:'Thresholds, exceptions and indicators that trigger further review.',valuation:'Valuation methods and their dependencies on normalized financials.'})[selectedGraph]||'Connected knowledge and evidence.'}</p></div></div><div class="row between section"><span class="tiny">Select any node to inspect its connections</span><button class="link" onclick="go('node')">Edit node →</button></div>${btn('Continue to capabilities',"go('capabilities')")}`,{back:'interview',title:'Knowledge Graph'}),
node:()=>shell(`<div class="eyebrow">Knowledge node · FIN-012</div><div class="h1" style="margin-top:7px">Current ratio.</div><p class="sub">A liquidity measure captured from your expertise.</p>${field('Definition','Current assets divided by current liabilities')}${field('Formula','Current Assets / Current Liabilities')}<div class="field"><label>Interpretation rule</label><textarea class="textarea">A ratio below 1.0 may indicate short-term liquidity pressure. Interpret against industry context.</textarea></div><div class="card soft"><div class="row between"><span class="rowtitle">Source attribution</span><span class="pill">Creator input</span></div><div class="rowsub">Interview · Financial Analysis · Draft v0.1</div></div>${btn('Save node',"go('knowledge')")}${btn('Add relationship',"openSheet('Connect this concept','Connect Current ratio to Liquidity risk, Balance sheet and Financial health.')",'secondary')}`,{back:'knowledge',title:'Node detail'}),
capabilities:()=>shell(`<div class="h1">Your capabilities.</div><p class="sub">Wiseman found several ways your expertise can be used. Choose what belongs in this Drop.</p>${[['Financial Health Analysis','Evaluate statements and key ratios.'],['Company Valuation','Apply valuation methods and comparables.'],['Risk Assessment','Identify financial risk indicators.'],['Candidate Assessment','Evaluate role competencies from supplied evidence.']].map((x,i)=>`<div class="card" style="margin:9px 0"><div class="row"><div class="glyph">${['▤','◇','!','✓'][i]}</div><div class="grow"><div class="rowtitle">${x[0]}</div><div class="rowsub">${x[1]}</div></div><input class="toggle" type="checkbox" ${i<3?'checked':''}></div></div>`).join('')}${btn('Confirm capabilities',"go('execution')")}${btn('Suggest another capability',"showToast('Wiseman will ask follow-up questions')",'secondary')}`,{back:'knowledge',title:'Capabilities'}),
execution:()=>shell(`<div class="h1">Execution Graph.</div><p class="sub">How Financial Health Analysis runs. This is how the Drop works—not what it knows.</p><div class="section"><div class="sectionhead"><h3 class="h3">Execution flow</h3><span class="pill">6 steps · 2 branches</span></div>${graphSvg('exec')}<div class="nodeinfo"><div class="row between"><b class="rowtitle">${({input:'Input contract',validate:'Validate schema',extract:'Extract values',ratios:'Calculate ratios',rules:'Apply rules',output:'Evidence output'})[selectedGraph]||'Execution node'}</b><span class="pill">Selected step</span></div><p class="rowsub">${({input:'Accept financial statements and required reporting context.',validate:'Check required fields, data types, periods and currency.',extract:'Normalize line items and map source values to the canonical schema.',ratios:'Calculate deterministic financial ratios from validated inputs.',rules:'Apply creator-defined thresholds, exceptions and decision logic.',output:'Generate a structured result with traceable evidence and version provenance.'})[selectedGraph]||'A connected step in the execution graph.'}</p></div></div><div class="card soft section"><div class="rowtitle">Deterministic execution</div><div class="rowsub">Same version + same input + same pinned dependencies = same output, where the workflow is deterministic.</div></div>${btn('Configure integrations',"go('integrations')")}${btn('Continue to tests',"go('tests')",'secondary')}`,{back:'capabilities',title:'Execution Graph'}),
integrations:()=>shell(`<div class="h1">Connect what it needs.</div><p class="sub">Choose where data comes from and how access is authorized.</p><div class="card section"><div class="row"><div class="glyph">⌘</div><div class="grow"><div class="rowtitle">Creator-managed</div><div class="rowsub">Use integrations connected by this workspace.</div></div><span class="pill">Optional</span></div></div><div class="card section"><div class="row"><div class="glyph">↗</div><div class="grow"><div class="rowtitle">Buyer-connected</div><div class="rowsub">Each buyer authorizes their own data access.</div></div><span class="pill">Optional</span></div></div>${[['API connection','Scoped HTTP API'],['MCP server','External tools'],['Database','PostgreSQL / MongoDB'],['Search','Live web search'],['Custom code','Sandboxed package']].map((x,i)=>row(x[0],x[1],['↗','⌘','▤','⌕','{}'][i],`openSheet('${x[0]}','Configure access scope and authorization for this connection.')`)).join('')}<p class="footer-note">Credentials belong in an encrypted secret manager, never in the Knowledge Graph or source code.</p>${btn('Continue to tests',"go('tests')")}`,{back:'execution',title:'Integrations'}),
tests:()=>shell(`<div class="h1">Prove it works.</div><p class="sub">Tests check your rules against examples and expected results.</p><div class="row between section"><h3 class="h3">Test suite</h3><span class="pill">12 cases</span></div>${[['Valid statements','Input validation'],['Low liquidity scenario','Rule boundary'],['Missing cash-flow data','Missing field'],['Negative revenue','Edge case']].map((x,i)=>`<div class="listrow"><div class="glyph">${i===2?'!':'✓'}</div><div class="grow"><div class="rowtitle">${x[0]}</div><div class="rowsub">${x[1]}</div></div><span class="pill">${i===2?'Review':'Ready'}</span></div>`).join('')}<div class="card soft section"><div class="rowtitle">Expected vs actual</div><div class="rowsub">Every test compares structured output against an expected result.</div></div>${btn('Run all tests',"state.testsRun=true;go('testresult')")}${btn('Add test case',"openSheet('New test case','Add a name, input and expected output for this test.')",'secondary')}`,{back:'integrations',title:'Test suite'}),
testresult:()=>shell(`<div class="row between"><div><div class="h1">Test results.</div><p class="sub">Build 0.1.3 · Completed just now</p></div><span class="pill dark">${state.testsRun?'Passed':'Ready'}</span></div><div class="darkcard section"><div class="row between"><div><div class="tiny" style="color:#aaa">Tests passed</div><div style="font-size:35px;font-weight:780">11 / 12</div></div><div style="font-size:32px">✓</div></div><div class="progress" style="background:#444;margin-top:13px"><span style="width:92%;background:white"></span></div></div><div class="section"><h3 class="h3">Needs attention</h3>${row('Missing cash-flow data','Expected graceful fallback; actual output failed validation.','!',"showToast('Failure details opened')")}</div><div class="card soft section"><div class="rowtitle">Repair with Wiseman</div><div class="rowsub">A correction creates a new build and reruns affected tests.</div></div>${btn('Ask Wiseman to fix',"showToast('Repair proposal prepared');go('tests')")}${btn('Continue with passing build',"go('pricing')",'secondary')}`,{back:'tests',title:'Test results'}),
pricing:()=>shell(`<div class="h1">Set your price.</div><p class="sub">Choose how buyers pay for this capability.</p><div class="card section"><div class="eyebrow">Suggested price</div><div class="h1" style="margin:8px 0">$2.00 <span class="sub">/ execution</span></div><div class="rowsub">Suggested range: $1.50–$2.75</div><div class="divider"></div><div class="row between"><span class="rowsub">Estimated execution cost</span><b class="rowtitle">$0.18</b></div><div class="row between" style="margin-top:8px"><span class="rowsub">Creator share (illustrative)</span><b class="rowtitle">85%</b></div></div>${field('Your execution price (USD)','$2.00','number',state.price)}<div class="field"><label>Billing model</label><select class="select"><option>Per execution</option><option>Subscription</option><option>Volume bundle</option></select></div><div class="card soft"><div class="rowtitle">Price transparency</div><div class="rowsub">Buyers see capability price and any execution costs before approval.</div></div>${btn('Review publication',"go('publish')")}`,{back:'testresult',title:'Pricing'}),
publish:()=>shell(`<div class="h1">Ready to publish?</div><p class="sub">Review what people can see, use and reuse.</p><div class="card section">${[['Discoverability','Can people find this Drop?',['Public','Private']],['Execution access','Who can run it?',['Public','Workspace','Invited']],['Structure inspection','Can people inspect the graph?',['Hidden','Allowed']],['Compounding','Allow licensed reuse?',['Disabled','Allowed']]].map((x,i)=>`<div class="row between" style="padding:6px 0"><div class="grow"><div class="rowtitle">${x[0]}</div><div class="rowsub">${x[1]}</div></div><select class="select" style="width:112px;padding:8px">${x[2].map(o=>`<option>${o}</option>`).join('')}</select></div>${i<3?'<div class="divider"></div>':''}`).join('')}</div><div class="card soft section"><div class="rowtitle">Contributor and IP declaration</div><div class="rowsub">Confirm rights basis, contributors, license terms and attribution before publication.</div><label class="tiny" style="display:block;margin-top:10px"><input type="checkbox" class="toggle" id="rightscheck"> I have the rights or permissions required to publish this material.</label></div>${btn('Publish Drop',"publishDrop()")}${btn('Save as draft',"go('dashboard')",'secondary')}`,{back:'pricing',title:'Publish Drop'}),
ask:()=>shell(`<div class="h1">Ask anything.</div><p class="sub">Describe what you need. Wiseman finds capabilities across Drops.</p><div class="card section"><textarea class="textarea" id="askinput" style="border:0;padding:0;min-height:90px" placeholder="What do you want to accomplish?"></textarea><div class="row between"><span class="tiny">Add files · Add context</span><button class="btn small" onclick="go('plan')">↑</button></div></div><div class="section"><h3 class="h3">Try asking</h3>${['Evaluate this company’s financial health','Compare two companies','Review a contract for risk','Assess a finance candidate'].map(x=>row(x,'Suggested request','✧',"go('plan')")).join('')}</div><div class="card soft section"><div class="rowtitle">Your workspace context</div><div class="rowsub">Personal Space · You control connected data and spending.</div></div>`,{tab:'ask'}),
plan:()=>shell(`<div class="eyebrow">Ask Anything · Plan</div><div class="h1" style="margin-top:6px">Here's how we'll<br>solve it.</div><div class="chatbubble user">Evaluate this company's financial health, valuation and risks.</div><div class="section"><div class="row between"><h3 class="h3">3 capabilities found</h3><span class="pill">3 Drops</span></div>${[['Financial Health Analysis','Finance Expert','$2.00'],['Company Valuation','Valuation Studio','$4.50'],['Risk Assessment','Risk Analyst','$1.50']].map((x,i)=>`<div class="listrow"><div class="glyph">${i+1}</div><div class="grow"><div class="rowtitle">${x[0]}</div><div class="rowsub">${x[1]} · v1.2</div></div><b class="rowtitle">${x[2]}</b></div>`).join('')}</div><div class="card soft section"><div class="row between"><b class="rowtitle">Estimated total</b><b class="h2">$8.00</b></div><div class="rowsub">Execution costs, if any, are disclosed separately before approval.</div></div><div class="card section"><div class="rowtitle">Data and permissions</div><div class="rowsub">No external database access requested. Supplied input is processed within the approved execution.</div></div>${btn('Approve & run · $8.00',"go('result')")}${btn('Edit execution plan',"go('ask')",'secondary')}`,{tab:'ask',back:'ask',title:'Execution plan'}),
result:()=>shell(`<div class="row between"><span class="pill dark">Completed</span><span class="tiny">Run · just now</span></div><div class="h1" style="margin-top:12px">Financial health<br>summary.</div><p class="sub">Three capabilities contributed to this result.</p><div class="card section"><div class="row between"><div><div class="eyebrow">Overall assessment</div><div class="h2" style="margin-top:6px">Moderate risk</div></div><div class="glyph" style="width:50px;height:50px;border-radius:50%;font-size:20px">!</div></div><div class="rowsub" style="margin-top:9px">Based on supplied statements and selected Drop versions. Not investment advice.</div></div><div class="section"><h3 class="h3">Financial position</h3><p class="sub" style="margin-top:7px">Liquidity is adequate, but operating cash flow has weakened over the last two periods.</p><div class="tiny" style="margin-top:8px">Source: Financial Health Analysis · v1.2</div></div><div class="divider"></div><div class="section"><h3 class="h3">Valuation and risks</h3><p class="sub" style="margin-top:7px">The valuation range is sensitive to the earnings multiple. Debt maturity is the primary risk to investigate.</p></div><div class="card soft section"><div class="row between"><b class="rowtitle">Provenance receipt</b><button class="link" onclick="openSheet('Provenance receipt','3 Drops · 3 creators · 3 versions · 8 licensed contributions. Attribution, version and license information are retained.')">View</button></div><div class="rowsub">Traceable sources and execution versions.</div></div>${btn('Share result',"go('sharing')")}${btn('View execution receipt',"openSheet('Execution receipt','Run ID · RUN-2026-019 · Input hash · Version pins · Output hash.')",'secondary')}`,{tab:'ask',back:'ask',title:'Your answer'}),
store:()=>shell(`<div class="h1">Drop Store.</div><p class="sub">Find software built from real expertise.</p><div class="search section" onclick="go('storesearch')">⌕ <span>Search by task, profession or capability</span></div><div class="section"><div class="sectionhead"><h3 class="h3">Browse categories</h3><button class="link" onclick="go('storesearch')">All</button></div><div class="chips">${['All','Finance','Accounting','Legal','People','Engineering'].map(x=>`<button onclick="showToast('${x} selected')">${x}</button>`).join('')}</div></div><div class="section"><h3 class="h3">Popular capabilities</h3>${row('Financial Analysis Suite','Finance · 4.8 ★ · 2.1K executions','▤',"go('detail')")}${row('Contract Risk Review','Legal · 4.9 ★ · 980 executions','§',"go('detail')")}${row('Candidate Interview Kit','People · 4.7 ★ · 760 executions','◎',"go('detail')")}</div><div class="section"><h3 class="h3">Built by creators</h3>${row('Finance Expert','Verified creator · 12 Drops','FE',"go('creator')")}</div>`,{tab:'store'}),
storesearch:()=>shell(`<div class="h1">Find a capability.</div><div class="search section">⌕ <input placeholder="What do you want to do?" id="storequery"></div><div class="section"><h3 class="h3">Suggested searches</h3>${['Analyze financial statements','Reconcile invoices','Review a legal contract','Assess a candidate','Compare company valuations'].map(x=>row(x,'Explore matching Drops','⌕',"go('detail')")).join('')}</div>`,{tab:'store',back:'store',title:'Search Drops'}),
detail:()=>shell(`<div class="darkcard" style="height:125px;display:flex;align-items:flex-end"><span class="pill" style="background:white;color:#111">Finance · Verified tests</span></div><div style="margin-top:16px"><div class="h1">Financial Analysis Suite.</div><div class="row" style="margin:7px 0"><span>★★★★★</span><b class="rowtitle">4.8</b><span class="tiny">· 2.1K executions · Verified creator</span></div><p class="sub">Turn financial statements into a structured, evidence-backed assessment.</p><div class="metricgrid section">${metric('12','Capabilities')}${metric('99.2%','Test pass rate')}</div><div class="section"><h3 class="h3">What it can do</h3>${row('Financial health','Liquidity, profitability and leverage','▤',"showToast('Capability selected')")}${row('Company valuation','Multiples and scenario analysis','◇',"showToast('Capability selected')")}${row('Risk assessment','Identify financial red flags','!',"showToast('Capability selected')")}</div><div class="card soft section"><div class="rowtitle">Creator and licensing</div><div class="rowsub">Finance Expert · Attribution preserved · Licensed compounding available</div></div>${btn('Use this Drop',"go('plan')")}${btn('View creator',"go('creator')",'secondary')}`,{tab:'store',back:'store',title:'Drop details'}),
creator:()=>shell(`<div style="text-align:center;padding:10px 0 18px"><div class="avatar" style="width:68px;height:68px;font-size:18px;margin:auto">FE</div><div class="h2" style="margin-top:12px">Finance Expert</div><p class="sub">Independent finance professional</p><div class="row" style="justify-content:center;margin-top:10px"><span class="pill">✓ Identity verified</span><span class="pill">4.8 ★</span></div></div><div class="metricgrid">${metric('12','Published Drops')}${metric('8.4K','Executions')}${metric('96%','Positive ratings')}${metric('3 yrs','On Wiseman')}</div><div class="section"><h3 class="h3">Creator catalogue</h3>${row('Financial Analysis Suite','Finance · 4.8 ★','▤',"go('detail')")}${row('Working Capital Monitor','Finance · 4.7 ★','↗',"go('detail')")}</div>${btn('Follow creator',"showToast('Following Finance Expert')")}`,{tab:'store',back:'detail',title:'Creator profile'}),
more:()=>shell(`<div class="h1">More.</div><p class="sub">Manage your identity, workspaces and account.</p><div class="row section" onclick="go('profile')">${avatar()}<div class="grow"><div class="rowtitle">${state.profileName}</div><div class="rowsub">${state.profileEmail}</div></div><span class="chev">›</span></div><div class="section">${row('Workspaces & members','Personal and team spaces','◉',"go('workspace')")}${row('Earnings','Creator balance and royalties','$',"go('earnings')")}${row('Payout methods','Manage withdrawal destinations','⇧',"go('payouts')")}${row('Sharing & permissions','Access, reuse and licensing','↗',"go('sharing')")}${row('Settings','Preferences and notifications','⚙',"go('settings')")}${row('Privacy & security','Account and data controls','▣',"go('security')")}</div>`,{tab:'more'}),
profile:()=>shell(`<div class="row" style="gap:13px;margin:5px 0 18px"><div class="avatar" style="width:62px;height:62px;font-size:17px">VK</div><div class="grow"><div class="h2">${state.profileName}</div><div class="rowsub">@vikash · Personal Space</div></div></div><div class="card soft"><div class="row between"><div><div class="rowtitle">Profile visibility</div><div class="rowsub">Public creator profile</div></div><span class="pill">Public</span></div></div><div class="section"><h3 class="h3">Your creator identity</h3>${field('Name','Your name','text',state.profileName)}${field('Email','you@example.com','email',state.profileEmail)}${field('About','What do you create?')}</div>${btn('Save profile',"showToast('Profile changes saved locally')")}`,{tab:'more',back:'more',title:'My profile'}),
earnings:()=>shell(`<div class="eyebrow">Creator balance</div><div class="h1" style="font-size:36px;margin-top:8px">₹12,480</div><div class="row" style="gap:7px"><span class="pill">Available ₹9,840</span><span class="tiny">Updated just now</span></div><div class="metricgrid section">${metric('₹8,200','Execution revenue')}${metric('₹4,280','Compounding royalties')}${metric('₹2,640','Pending')}${metric('1,284','Paid executions')}</div><div class="section"><div class="sectionhead"><h3 class="h3">Recent activity</h3><button class="link" onclick="go('payouts')">Payouts</button></div>${row('Financial Analysis Suite','Execution · Today · +₹170','＋',"showToast('Transaction details opened')")}${row('Licensed compound','Royalty · Yesterday · +₹84','↗',"showToast('Royalty details opened')")}${row('Working Capital Monitor','Execution · 18 Nov · +₹120','＋',"showToast('Transaction details opened')")}</div>${btn('Manage payouts',"go('payouts')")}`,{tab:'more',back:'more',title:'Earnings'}),
payouts:()=>shell(`<div class="h1">Payout methods.</div><p class="sub">Manage where available earnings are sent.</p><div class="card section"><div class="eyebrow">Available balance</div><div class="h1" style="margin:8px 0">₹9,840</div><div class="rowsub">Withdrawable balance · INR</div></div><div class="section"><div class="sectionhead"><h3 class="h3">Payout methods</h3><button class="link" onclick="openSheet('Add payout method','Enter bank account or UPI details.')">＋ Add</button></div>${row('Bank account · •• 4821','Primary payout method · Verified','▤',"showToast('Bank details opened')")}${row('UPI · vikash@upi','Secondary payout method','↗',"showToast('UPI details opened')")}</div>${btn('Withdraw funds',"openSheet('Withdraw funds','Withdrawal requests are represented locally in this prototype.')")}`,{tab:'more',back:'more',title:'Payout methods'}),
sharing:()=>shell(`<div class="h1">Sharing & permissions.</div><p class="sub">Control how each Drop can be discovered, used and reused.</p><div class="card section"><div class="row between"><div><div class="rowtitle">Default visibility</div><div class="rowsub">New Drops start private</div></div><span class="pill">Private</span></div><div class="divider"></div>${[['Execution access','Who can run a capability?'],['Graph inspection','Who can inspect internal structure?'],['Compounding','Who can build on this Drop?'],['Attribution','How contributors are credited?']].map(x=>`<div style="padding:6px 0"><div class="rowtitle">${x[0]}</div><div class="rowsub">${x[1]}</div><select class="select" style="margin-top:6px"><option>Owner controlled</option><option>Workspace</option><option>Public with license</option></select></div>`).join('<div class="divider"></div>')}</div><div class="card soft section"><div class="rowtitle">Rights travel with reuse</div><div class="rowsub">Contributor attribution, license terms and royalty obligations remain attached when a Drop is compounded.</div></div>${btn('Save permissions',"showToast('Permission preferences saved locally')")}`,{tab:'more',back:'more',title:'Sharing & permissions'}),
settings:()=>shell(`<div class="h1">Settings.</div>${[['Appearance','Light / Dark / System'],['Language','English'],['Notifications','Push and email preferences'],['Privacy','Data and account controls'],['Connected devices','Sessions and devices'],['Help and support','Contact Wiseman']].map(x=>row(x[0],x[1],'⚙',`showToast('${x[0]} settings opened')`)).join('')}${btn('Sign out',"go('welcome')",'secondary')}`,{tab:'more',back:'more',title:'Settings'}),
security:()=>shell(`<div class="h1">Privacy & security.</div><p class="sub">Control account protection and your data.</p>${[['Sign-in & authentication','Password, Apple sign-in and sessions'],['Two-factor authentication','Add another layer of account security'],['Active sessions','Review signed-in devices'],['Data and privacy','Export or delete your data'],['Connected credentials','Revoke integrations and API access'],['Rights and reports','Manage content and rights requests']].map(x=>row(x[0],x[1],'▣',`showToast('${x[0]} opened')`)).join('')}<div class="card soft section"><div class="rowtitle">Private by default</div><div class="rowsub">New Drops start private. Publishing requires explicit access, licensing and rights choices.</div></div>`,{tab:'more',back:'more',title:'Privacy & security'})
};
function publishDrop(){let c=$('rightscheck');if(!c?.checked){showToast('Please confirm the rights declaration first.');return}dropPublished=true;showToast('Drop published in this prototype');go('dashboard')}
function go(id){current=id;if(id==='knowledge')selectedGraph='ratio';if(id==='execution')selectedGraph='input';render();if(window.innerWidth<900)document.querySelector('.phone').scrollIntoView({block:'nearest'})}
function render(){let fn=screens[current]||screens.dashboard;$('screen').innerHTML=fn()+`<div class="homeindicator"></div>`;document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.screen===current));$('screenlabel').textContent=current.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase())+' · interactive prototype'}
function buildNav(){$('sidenav').innerHTML=groups.map(([g,items])=>`<div class="navgroup"><label>${g}</label>${items.map(([id,label])=>`<button class="navitem" data-screen="${id}" onclick="go('${id}')"><span>${({dashboard:'⌂',create:'＋',knowledge:'⌘',execution:'⌁',ask:'✧',store:'▦',earnings:'＄'})[id]||'◦'}</span>${label}</button>`).join('')}</div>`).join('')}
buildNav();render();
</script></body></html>
